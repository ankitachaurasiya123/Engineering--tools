<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    padding:30px;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#0056b3;
    margin-bottom:20px;
}

.formula{
    background:#eef5ff;
    padding:12px;
    border-left:4px solid #0078d7;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
}

.input-row{
    display:flex;
    gap:10px;
}

.input-row input{
    flex:2;
}

.input-row select{
    flex:1;
    padding:10px;
}

.btn-group{
    display:flex;
    gap:10px;
    margin-top:20px;
}

button{
    flex:1;
    padding:12px;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.calc-btn{
    background:#0078d7;
}

.reset-btn{
    background:#888;
}

.result{
    margin-top:20px;
    background:#f0fff4;
    padding:15px;
    border-left:4px solid green;
    border-radius:6px;
}
</style>

</head>

<body>

<div class="container">

<h1>Power Calculator</h1>

<div class="formula">
<b>Formula:</b><br>
P = V × I
</div>

<label>Voltage (V)</label>
<input type="number" id="voltage" placeholder="Enter Voltage">

<label>Current</label>

<div class="input-row">

<input type="number" id="current">

<select id="currentUnit">
    <option value="1">A</option>
    <option value="0.001">mA</option>
    <option value="0.000001">µA</option>
</select>

</div>

<div class="btn-group">

<button class="calc-btn" onclick="calculatePower()">
Calculate
</button>

<button class="reset-btn" onclick="resetFields()">
Reset
</button>

</div>

<div class="result">

<h2 id="result">
Power:
</h2>

</div>
<div style="margin-bottom:20px;">
    <a href="index.html">🏠 Home</a>
</div>

<script>

function calculatePower(){

    let voltage =
        parseFloat(document.getElementById("voltage").value);

    let current =
        parseFloat(document.getElementById("current").value);

    let currentUnit =
        parseFloat(document.getElementById("currentUnit").value);

    current = current * currentUnit;

    if(isNaN(voltage) || isNaN(current)){

        alert("Please enter all values");
        return;
    }

    let power = voltage * current;

    document.getElementById("result").innerHTML =
        "Power = " + power.toFixed(3) + " W";
}

function resetFields(){

    document.getElementById("voltage").value = "";
    document.getElementById("current").value = "";
    document.getElementById("currentUnit").value = "1";

    document.getElementById("result").innerHTML =
        "Power:";
}

</script>

</body>
</html>
